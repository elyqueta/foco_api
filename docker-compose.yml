services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_URL: ${DB_URL}
      DB_DIRECT_URL: ${DB_DIRECT_URL}
      DB_SSLMODE: ${DB_SSLMODE}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS}
      RUN_SEEDERS: ${RUN_SEEDERS}
    restart: unless-stopped

volumes:
  pgdata:
