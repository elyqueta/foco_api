services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:enxs9MMLkPu63fyw4Fof4X83/Cnu+hVmiLl8GR2Ctl8=
      - APP_URL=http://localhost:8080
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=stack
      - LOG_STACK=single
      - LOG_LEVEL=debug
    volumes:
      - ./database:/var/www/html/database
    restart: unless-stopped
