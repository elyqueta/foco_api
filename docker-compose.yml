services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: foco
      DB_USERNAME: foco
      DB_PASSWORD: foco
      DB_URL: ""
      DB_DIRECT_URL: ""
      DB_SSLMODE: prefer
      RUN_MIGRATIONS: "true"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: foco
      POSTGRES_USER: foco
      POSTGRES_PASSWORD: foco
    ports: ["127.0.0.1:5437:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foco -d foco"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: